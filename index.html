<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0f15">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%231b2027%22/%3E%3Cpath d=%22M11 28V10l5-4 5 4v18z%22 fill=%22%234d545d%22/%3E%3Cpath d=%22M16 26c-3 0-4-3-2-6s2-5 2-5 4 3 3 7c-.4 2-1.5 4-3 4z%22 fill=%22%23ff9a3c%22/%3E%3C/svg%3E">
<title>冰原余烬 · 冰汽时代风格城市生存</title>
<style>
:root{--brass:#c09a5b;--brass2:#7c5f33;--iron:#1c2128;--iron2:#2b323b;--ink:#e9e1d2;--warm:#ffb45e;--red:#ff6a55;--green:#8fdc8f;
 --serif:"Noto Serif SC","Source Han Serif SC","Source Han Serif CN","Songti SC","STSong","SimSun",serif;
 --sans:"PingFang SC","Noto Sans SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b0f15;color:var(--ink);font-family:var(--sans);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
#app{position:fixed;inset:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.plate{background:linear-gradient(180deg,#2c333c 0%,#1b2027 55%,#14181e 100%);border:1px solid #0a0c10;box-shadow:inset 0 1px 0 rgba(255,255,255,.09),inset 0 0 0 1px rgba(192,154,91,.35),0 4px 14px rgba(0,0,0,.55);
 background-image:radial-gradient(circle at 7px 7px,#d9b979 0 1.6px,#5a4424 2.2px,transparent 2.8px),radial-gradient(circle at calc(100% - 7px) 7px,#d9b979 0 1.6px,#5a4424 2.2px,transparent 2.8px),radial-gradient(circle at 7px calc(100% - 7px),#d9b979 0 1.6px,#5a4424 2.2px,transparent 2.8px),radial-gradient(circle at calc(100% - 7px) calc(100% - 7px),#d9b979 0 1.6px,#5a4424 2.2px,transparent 2.8px),linear-gradient(180deg,#2c333c 0%,#1b2027 55%,#14181e 100%)}
/* ---------- HUD ---------- */
#hud{position:absolute;left:0;right:0;top:0;z-index:10;padding:calc(6px + env(safe-area-inset-top)) 8px 6px;border-radius:0 0 12px 12px;border-top:none}
#res{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.chip{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:44px;padding:3px 2px;border-radius:7px;background:linear-gradient(#11161c,#0b0e12);border:1px solid #3a3122;box-shadow:inset 0 1px 3px #000;min-width:0}
.chip .top{display:flex;align-items:center;gap:3px}
.chip svg{width:16px;height:16px;flex:none}
.chip .v{font-family:var(--serif);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;color:#f3ead8;transition:color .3s}
.chip .v.up{color:#b7f5b7}.chip .v.down{color:#ffb3a6}
.chip .d{font-size:10px;color:#8d9aa8;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip .d.pos{color:var(--green)}.chip .d.neg{color:var(--red);font-weight:700}
.chip.low{border-color:#b8432f;animation:lowp 1.2s infinite}
@keyframes lowp{50%{box-shadow:inset 0 0 10px #b8432f99,0 0 6px #b8432f88}}
#status{display:flex;align-items:center;gap:7px;margin-top:6px}
#dial{position:relative;width:46px;height:46px;flex:none}
#dial svg{width:100%;height:100%}
#dialT{position:absolute;left:0;right:0;bottom:-1px;text-align:center;font-family:var(--serif);font-size:11px;font-weight:700;color:#bfe2ff;text-shadow:0 1px 2px #000}
#timebox{flex:none;line-height:1.2;min-width:70px}
#clock{font-family:var(--serif);font-size:14px;font-weight:700;color:#f3ead8}
#sub{font-size:10.5px;color:#9fb0c2}
.gauges{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0}
.gauge{display:flex;align-items:center;gap:5px;min-width:0}
.gauge .nm{font-size:11px;color:#c9b48c;width:26px;flex:none;font-family:var(--serif)}
.tube{flex:1;height:11px;border-radius:7px;background:#07090c;border:1px solid var(--brass2);box-shadow:inset 0 2px 3px #000;overflow:hidden;position:relative}
.tube i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;transition:width .5s}
.tube::after{content:"";position:absolute;left:2px;right:2px;top:1px;height:3px;border-radius:3px;background:rgba(255,255,255,.18)}
#hopeF{background:linear-gradient(180deg,#9fd8ff,#3c7fd0)}
#discF{background:linear-gradient(180deg,#ffb07a,#c2361f)}
.gauge .gv{width:38px;text-align:right;font-size:11px;font-variant-numeric:tabular-nums;flex:none}
.tr-up{color:var(--green)}.tr-dn{color:var(--red)}
#helpBtn{width:44px;height:44px;flex:none;border-radius:50%;font-family:var(--serif);font-size:20px;font-weight:700;color:#2a1c08;background:radial-gradient(circle at 35% 30%,#f2d595,#b38443 60%,#6d4f22);box-shadow:0 2px 6px #000,inset 0 -2px 3px rgba(0,0,0,.35)}
/* ---------- feeds ---------- */
#alerts{position:absolute;left:6px;z-index:9;display:flex;flex-direction:column;gap:5px;max-width:58%}
.al{display:flex;align-items:center;gap:6px;min-height:40px;padding:6px 10px 6px 8px;border-radius:8px;font-size:12.5px;line-height:1.25;text-align:left;background:linear-gradient(90deg,rgba(70,18,14,.94),rgba(40,12,10,.86));border:1px solid #b8432f;color:#ffd9cf;box-shadow:0 2px 8px #0008;animation:none;--a:alin .35s}
.al.warn{background:linear-gradient(90deg,rgba(66,50,14,.94),rgba(40,30,8,.86));border-color:#c0973a;color:#ffefc4}
.al.info{background:linear-gradient(90deg,rgba(18,40,62,.94),rgba(10,24,38,.86));border-color:#4f86b8;color:#d6ecff}
.al b{font-size:15px}.al .go{margin-left:auto;opacity:.75;font-size:11px;white-space:nowrap}

.al.nw{animation:alin .35s}
@keyframes alin{from{transform:translateX(-30px);opacity:0}}
#toasts{position:absolute;right:6px;z-index:9;display:flex;flex-direction:column;gap:4px;align-items:flex-end;pointer-events:none;max-width:44%}
.toast{background:rgba(14,19,26,.9);border:1px solid #4a5a6c;border-left:3px solid #8aa0b8;font-size:12px;padding:5px 9px;border-radius:6px;animation:tin .3s;transition:opacity .6s;text-align:right}
.toast.bad{border-left-color:var(--red);color:#ffd2c8}.toast.good{border-left-color:var(--green);color:#d6f7d6}
@keyframes tin{from{transform:translateX(20px);opacity:0}}
#tip{position:absolute;z-index:30;max-width:280px;padding:10px 12px;font-size:12.5px;line-height:1.55;border-radius:10px;color:#e8eef5}
#tip.hidden{display:none}
#tip h4{margin:0 0 4px;font-family:var(--serif);color:var(--warm);font-size:14px}
/* ---------- floating controls ---------- */
#heatBtn,#speed{position:absolute;z-index:9}
#heatBtn{left:8px;height:44px;padding:0 12px;border-radius:22px;font-size:13px;display:flex;align-items:center;gap:5px}
#heatBtn svg{width:18px;height:18px}
#heatBtn.on{box-shadow:0 0 0 2px var(--warm),0 4px 12px #000;color:#ffe2bd}
#speed{right:8px;display:flex;gap:3px;padding:3px;border-radius:24px}
#speed button{width:42px;height:40px;border-radius:20px;font-size:13px;font-weight:700;color:#cbd5df;display:flex;align-items:center;justify-content:center}
#speed button svg{width:16px;height:16px}
#speed button.on{background:radial-gradient(circle at 40% 30%,#ffcf8a,#b86a1e);color:#2a1606;box-shadow:inset 0 -2px 3px rgba(0,0,0,.3)}
/* ---------- nav ---------- */
#nav{position:absolute;left:0;right:0;bottom:0;z-index:12;display:flex;gap:5px;padding:6px 6px calc(6px + env(safe-area-inset-bottom));border-radius:12px 12px 0 0;border-bottom:none}
#nav button{flex:1;min-height:56px;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;font-family:var(--serif);font-weight:700;color:#e6dccb;background:linear-gradient(#323a44,#1d232a);border:1px solid #0b0d10;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),inset 0 0 0 1px rgba(192,154,91,.3);position:relative}
#nav button svg{width:24px;height:24px}
#nav button.on{background:linear-gradient(#6b4417,#3e2508);color:#ffe0b3;box-shadow:inset 0 0 0 1px #e0a050,0 0 12px rgba(255,160,60,.35)}
#nav button.primary{background:linear-gradient(#8a5a20,#5a3810);color:#fff0d8;box-shadow:inset 0 0 0 1px #e9b065}
#nav .badge{position:absolute;top:3px;right:6px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;line-height:18px;font-family:var(--sans);padding:0 4px}
/* ---------- placement bar ---------- */
#place{position:absolute;left:8px;right:8px;z-index:13;padding:10px 12px;border-radius:12px;display:flex;align-items:center;gap:10px}
#place.hidden{display:none}
#place img{width:64px;height:54px;flex:none}
#place .ptxt{flex:1;min-width:0;font-size:13px;line-height:1.45}
#place .ptxt b{font-family:var(--serif);color:var(--warm);font-size:15px}
#place .pbtns{display:flex;flex-direction:column;gap:6px}
/* ---------- buttons ---------- */
.btn{min-height:44px;padding:0 14px;border-radius:9px;font-size:14px;font-weight:700;color:#e9e1d2;background:linear-gradient(#3a4552,#232a33);border:1px solid #0b0d10;box-shadow:inset 0 1px 0 rgba(255,255,255,.1),inset 0 0 0 1px rgba(192,154,91,.35),0 2px 4px #0007}
.btn.pri{background:linear-gradient(#c27a2c,#7c4612);color:#fff4e2;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),inset 0 0 0 1px #f0b56a,0 2px 6px #0008}
.btn.red{background:linear-gradient(#8a2d22,#511410);box-shadow:inset 0 0 0 1px #d0604a}
.btn.ok{background:linear-gradient(#3f7d3f,#1f4a1f);box-shadow:inset 0 0 0 1px #8fd08f}
.btn:disabled{opacity:.38;filter:grayscale(.6);cursor:not-allowed}
.btn.sm{min-height:36px;font-size:13px;padding:0 10px}
/* ---------- sheet ---------- */
#sheet{position:absolute;left:0;right:0;z-index:11;max-height:60%;display:flex;flex-direction:column;border-radius:14px 14px 0 0;transition:transform .28s cubic-bezier(.2,.8,.3,1);border-bottom:none}
#sheet.hidden{transform:translateY(120%);pointer-events:none}
.sh-h{display:flex;align-items:center;gap:8px;padding:10px 12px 8px;border-bottom:1px solid rgba(192,154,91,.25)}
.sh-h h3{margin:0;flex:1;font-family:var(--serif);font-size:18px;color:#ffd9a8;letter-spacing:1px}
#sheetClose{width:44px;height:44px;border-radius:10px;font-size:20px;background:linear-gradient(#3a4552,#232a33);box-shadow:inset 0 0 0 1px rgba(192,154,91,.35)}
#sheetBody{overflow-y:auto;padding:10px 12px 16px;font-size:13.5px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
@media (min-width:900px){
 #sheet{left:auto;right:8px;width:420px;max-height:calc(100% - 200px);border-radius:14px;border-bottom:1px solid #0a0c10}
 #res{grid-template-columns:repeat(6,minmax(100px,150px));justify-content:center}
 #status{max-width:960px;margin:6px auto 0}
 #nav{left:50%;right:auto;transform:translateX(-50%);width:620px;border-radius:12px 12px 0 0}
 #place{left:50%;right:auto;transform:translateX(-50%);width:560px}
 #alerts{max-width:340px}
}
.lead{color:#aebccb;font-size:13px;line-height:1.5;margin:0 0 8px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:8px}
.bcard{display:flex;flex-direction:column;text-align:left;padding:8px;border-radius:10px;min-height:44px;background:linear-gradient(#232b35,#161b22);border:1px solid #0a0c10;box-shadow:inset 0 0 0 1px rgba(192,154,91,.28);position:relative}
.bcard img{width:100%;height:78px;object-fit:contain;background:radial-gradient(ellipse at 50% 80%,#cfd9e3 0,#9aabbb 45%,transparent 72%);border-radius:8px}
.bcard h4{margin:4px 0 2px;font-family:var(--serif);font-size:15px;color:#ffe3bf}
.bcard .eff{font-size:11.5px;color:#aebccb;line-height:1.35}
.bcard .why{margin-top:4px;font-size:11.5px;color:#ff9c8a;font-weight:700}
.bcard.dis{opacity:.55}.bcard.dis img{filter:grayscale(1) brightness(.7)}
.bcard:not(.dis):active{transform:scale(.97)}
.cost{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0}
.ci{display:inline-flex;align-items:center;gap:2px;font-size:12.5px;font-weight:700;color:#f0dcb8;font-variant-numeric:tabular-nums}
.ci svg{width:14px;height:14px}.ci.lack{color:#ff8a76}
.kvs{display:flex;flex-direction:column;gap:6px}
.kvr{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;background:rgba(0,0,0,.25);border:1px solid rgba(192,154,91,.15)}
.kvr .k{color:#9fb0c2;width:64px;flex:none;font-size:12.5px}
.kvr .val{flex:1;font-size:14px;line-height:1.4}
.kvr .val small{display:block;color:#9fb0c2;font-size:11.5px}
.bhead{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.bhead img{width:96px;height:80px;flex:none;background:radial-gradient(ellipse at 50% 80%,#cfd9e3 0,#9aabbb 45%,transparent 72%);border-radius:8px}
.bhead p{margin:0;color:#aebccb;font-size:12.5px;line-height:1.45}
.staff{display:flex;align-items:center;justify-content:center;gap:12px;margin:10px 0 4px}
.staff .big{width:60px;height:56px;border-radius:12px;font-size:30px;font-weight:700;background:linear-gradient(#3a4552,#232a33);box-shadow:inset 0 0 0 1px rgba(192,154,91,.45),0 2px 5px #0008}
.staff .big:active{transform:scale(.94)}
.staff .n{min-width:84px;text-align:center;font-family:var(--serif);font-size:28px;font-weight:700;color:#ffe3bf;line-height:1}
.staff .n small{display:block;font-size:11px;color:#9fb0c2;font-family:var(--sans);font-weight:400;margin-top:3px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;align-items:center}
.row.c{justify-content:center}
.muted{color:#8d9aa8;font-size:12px;line-height:1.5}
.pbar{height:12px;border-radius:7px;background:#07090c;border:1px solid var(--brass2);overflow:hidden;box-shadow:inset 0 2px 3px #000}
.pbar i{display:block;height:100%;background:linear-gradient(#ffc477,#c86a1a)}
.lvls{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.lvls button{min-height:64px;border-radius:10px;font-family:var(--serif);font-weight:700;font-size:15px;background:linear-gradient(#323a44,#1d232a);box-shadow:inset 0 0 0 1px rgba(192,154,91,.3);line-height:1.3}
.lvls button small{display:block;font-family:var(--sans);font-weight:400;font-size:10.5px;color:#9fb0c2}
.lvls button.on{background:linear-gradient(#b5671f,#6b3a0d);box-shadow:inset 0 0 0 2px #ffc477,0 0 12px rgba(255,150,50,.4);color:#fff3e0}
.lvls button.on small{color:#ffe0b8}
/* parchment */
.book{background:radial-gradient(ellipse at 50% 40%,#efe2c2 0%,#e2cfa6 60%,#c9ae7c 100%);color:#3a2814;border-radius:10px;padding:12px;box-shadow:inset 0 0 30px rgba(110,70,20,.45),0 3px 10px #0009;font-family:var(--serif);position:relative}
.book::before{content:"";position:absolute;inset:6px;border:1px solid rgba(110,70,20,.35);border-radius:6px;pointer-events:none}
.book h5{margin:0 0 6px;text-align:center;font-size:15px;letter-spacing:2px;color:#5a2f10}
.book .note{font-family:var(--sans);font-size:12px;color:#5d4526;text-align:center;margin-bottom:8px}
.laws{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.law{padding:8px;border-radius:6px;background:rgba(255,248,230,.45);border:1px solid rgba(110,70,20,.3);margin-bottom:7px;position:relative}
.law h4{margin:0 0 3px;font-size:14px;color:#3a1f08}
.law p{margin:0 0 6px;font-family:var(--sans);font-size:11.5px;line-height:1.45;color:#4a3822}
.law.signed{background:rgba(255,236,200,.65);border-color:#8a2a18}
.law.lock{opacity:.5}
.seal{position:absolute;right:6px;top:4px;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#d44a32,#8a1a10 70%);color:#ffd9c8;font-size:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px #0007;transform:rotate(-12deg)}
.tag{display:inline-block;font-family:var(--sans);font-size:10.5px;padding:1px 6px;border-radius:8px;background:rgba(90,50,20,.18);color:#6b3f18;margin-top:2px}
.btn.ink{background:linear-gradient(#6b3a16,#3e1f08);color:#ffe9c9;box-shadow:inset 0 0 0 1px #c08a4a}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.tcard{padding:9px;border-radius:10px;background:linear-gradient(#232b35,#161b22);box-shadow:inset 0 0 0 1px rgba(192,154,91,.28)}
.tcard.done{box-shadow:inset 0 0 0 1px #6fb36f;opacity:.75}.tcard.lock{opacity:.45}
.tcard h4{margin:0 0 3px;font-family:var(--serif);color:#ffe3bf;font-size:14px}
.tcard p{margin:3px 0 7px;font-size:11.5px;color:#aebccb;line-height:1.4}
.log{font-size:12px;color:#aebccb;max-height:170px;overflow:auto;border-top:1px solid rgba(192,154,91,.25);margin-top:10px;padding-top:6px}
.log div{margin:3px 0}
/* ---------- modal ---------- */
#modal{position:absolute;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,rgba(5,8,12,.55),rgba(2,4,8,.85));padding:16px}
#modal.hidden{display:none}
.paper{max-width:440px;width:100%;padding:18px 18px 14px;border-radius:6px;color:#33230f;font-family:var(--serif);background:radial-gradient(ellipse at 50% 30%,#f3e7c9 0%,#e3d0a6 65%,#c7aa76 100%);box-shadow:inset 0 0 40px rgba(110,70,20,.5),0 12px 40px #000;position:relative;animation:pin .35s cubic-bezier(.2,.9,.3,1.2)}
.paper::before{content:"";position:absolute;inset:7px;border:1.5px double rgba(110,70,20,.45);pointer-events:none}
@keyframes pin{from{transform:scale(.9) rotate(-1deg);opacity:0}}
.paper h2{margin:0 0 4px;text-align:center;font-size:20px;letter-spacing:3px;color:#4d1f08}
.paper .orn{text-align:center;color:#8a5a2a;font-size:12px;letter-spacing:6px;margin-bottom:6px}
.paper p{font-size:15px;line-height:1.75;margin:4px 0 12px;color:#3a2a14}
.ch{display:block;width:100%;text-align:left;margin:8px 0;min-height:48px;padding:9px 12px;border-radius:6px;font-family:var(--serif);font-size:15px;font-weight:700;color:#2e1a06;background:linear-gradient(rgba(255,250,236,.75),rgba(235,215,175,.75));border:1px solid rgba(110,70,20,.5);box-shadow:0 2px 4px rgba(80,50,10,.3)}
.ch:active{transform:scale(.98)}
.ch small{display:block;font-family:var(--sans);font-weight:400;color:#6a4a26;font-size:12px;margin-top:2px}
.ch:disabled{opacity:.45}
.paper .help{font-family:var(--sans);font-size:13.5px;line-height:1.7;max-height:55vh;overflow:auto;color:#3a2a14}
.paper .help b{color:#7a2a0a}
.skinsel{display:flex;align-items:center;justify-content:center;gap:6px;margin:4px 0 10px;flex-wrap:wrap}
.skinsel span{font-size:13px;color:#c9b48c;font-family:var(--serif)}
.paper .skinsel span{color:#6a3f18}
.skinsel button{min-height:44px;padding:0 14px;border-radius:22px;font-size:14px;font-weight:700;background:linear-gradient(#3a4552,#232a33);color:#e9e1d2;box-shadow:inset 0 0 0 1px rgba(192,154,91,.45)}
.skinsel button.on{background:linear-gradient(#fffdf6,#e8e2d2);color:#1a1a1a;box-shadow:inset 0 0 0 2px #1a1a1a,0 0 10px rgba(255,255,255,.35)}
/* ---------- campaign ---------- */
#app:has(#screen:not(.hidden)) :is(#hud,#nav,#speed,#heatBtn,#alerts,#obj,#toasts,#place,#sheet){visibility:hidden}
#obj{position:absolute;left:6px;z-index:9;max-width:62%;min-width:200px;border-radius:10px;padding:0;font-size:12.5px;overflow:hidden}
#obj.hidden{display:none}
#obj.flash{box-shadow:0 0 0 2px #7ee07e,0 0 18px rgba(120,230,120,.6)}
#obj .oh{display:flex;align-items:center;gap:6px;width:100%;min-height:40px;padding:6px 10px;color:#ffe3bf;font-family:var(--serif);text-align:left}
#obj .oh b{font-size:13.5px;white-space:nowrap}

'use strict';
/* ====================== 数据定义 ====================== */
const $=s=>document.querySelector(s);
const HOUR_MS=3000, DAYS=30, SAVE_KEY='bingyuan-yujin-save-v1';
const RES=[['coal','煤炭','🪨'],['wood','木材','🪵'],['steel','钢铁','⚙️'],['raw','生食','🥩'],['food','口粮','🍲']];

const RINGS=[{n:6,r:0.30,f:1.0},{n:10,r:0.535,f:0.8},{n:14,r:0.77,f:0.6}];
const LEVELS=[['舒适','#ffb347'],['寒冷','#e8d27a'],['极寒','#6fb6ff'],['冻结','#5b6cff']];
const B={
 tent:{name:'帐篷',ic:'⛺',kind:'house',cost:{wood:10},cap:10,ins:0,desc:'简陋的帆布帐篷，可住10人，几乎不保温。'},
 house:{name:'保温木屋',ic:'🏠',kind:'house',cost:{wood:25,steel:5},cap:10,ins:15,req:'house',desc:'厚木墙加小火炉，可住10人，保温 +15°C。'},
 coal:{name:'采煤站',ic:'⛏️',kind:'work',cost:{wood:15,steel:5},max:10,prod:'coal',rate:1.0,tech:'coal2',ins:5,desc:'从冻土里凿出煤块。每名工人每小时约1煤炭。'},
 saw:{name:'伐木场',ic:'🪓',kind:'work',cost:{wood:15},max:10,prod:'wood',rate:0.5,tech:'saw2',ins:5,desc:'砍伐冰封的枯树。每名工人每小时约0.5木材。'},
 steel:{name:'钢铁厂',ic:'🏭',kind:'work',cost:{wood:30,steel:10},max:10,prod:'steel',rate:0.25,tech:'steel2',ins:5,desc:'回收废铁、冶炼钢材。每名工人每小时约0.25钢铁。'},
 hunt:{name:'猎人小屋',ic:'🏹',kind:'work',cost:{wood:15},max:5,prod:'raw',rate:0.4,tech:'hunt2',ins:0,desc:'猎人出城狩猎，带回生食。在户外工作，容易冻病。'},

 heater:{name:'蒸汽加热器',ic:'♨️',kind:'heater',cost:{wood:10,steel:15},req:'heater',ins:0,desc:'为周围建筑 +20°C，每小时消耗2煤炭。'},
};
const BUILD_ORDER=['tent','house','coal','saw','hunt','kitchen','med','lab','steel','heater'];
const TECH=[
 {id:'heater',name:'蒸汽加热器',cost:80,desc:'解锁加热器：周围建筑 +20°C。'},
 {id:'house',name:'保温木屋',cost:90,desc:'解锁木屋：保温 +15°C 的住所。'},
 {id:'coal2',name:'深层钻头',cost:105,desc:'采煤站产量 +30%。'},
 {id:'hunt2',name:'改良猎枪',cost:80,desc:'猎人小屋产量 +30%。'},
 {id:'saw2',name:'蒸汽锯',cost:80,desc:'伐木场产量 +30%。'},
 {id:'power1',name:'熔炉增压 I',cost:115,desc:'熔炉各档热量 +10°C。'},
 {id:'med2',name:'消毒药剂',cost:105,desc:'医疗站容量 +50%，治愈更快。'},

 {id:'power2',name:'熔炉增压 II',cost:195,req:'power1',desc:'熔炉各档热量再 +10°C。'},
];
const LAWS=[
 {id:'overtime',br:0,name:'延长工时',desc:'工作时间延长到 22:00，产量大增；加班期间不满上升。签署：不满 +5。'},
 {id:'emergency',br:0,name:'紧急轮班',req:'overtime',desc:'解锁“紧急轮班”：接下来24小时全城连轴转，不满 +10，可能出工伤事故。冷却3天。'},
 {id:'sawdust',br:0,name:'汤里加木屑',desc:'厨房每份生食多出25%口粮，但人们更容易生病。签署：希望 -3。'},
 {id:'childlabor',br:0,name:'童工',ex:'shelter',desc:'儿童可在普通岗位工作（效率60%）。签署：希望 -10。'},
 {id:'snowpit',br:0,name:'雪坑',ex:'cemetery',desc:'把遗体埋进城外雪坑，死亡对士气的打击减半。签署：希望 -5。'},
 {id:'shelter',br:1,name:'儿童庇护所',ex:'childlabor',desc:'孩子们在庇护所里学习：每名健康儿童每个工作小时 +0.1 研究点，希望缓慢上升。签署：希望 +5。'},
 {id:'cemetery',br:1,name:'墓地',ex:'snowpit',cost:{wood:30},desc:'体面地安葬死者，死亡对士气的打击降低60%。消耗木材30。签署：希望 +5。'},
 {id:'care',br:1,name:'额外口粮',desc:'病人每餐多领一份口粮，治愈速度 +50%。签署：希望 +3。'},
 {id:'festival',br:1,name:'篝火集会',desc:'解锁“集会”：消耗20口粮，希望 +8，不满 -10。冷却4天。'},
];
/* ====================== 状态 ====================== */
let S=null, speed=1, heatView=false, sel=-1, sheetMode=null, modalOpen=false, lastDelta={}, pointerInSheet=false;
const slots=[];
RINGS.forEach((R,ri)=>{for(let i=0;i<R.n;i++){const a=i/R.n*Math.PI*2-Math.PI/2+[0.52,0.31,0.62][ri];slots.push({ring:ri,x:Math.cos(a)*R.r,y:Math.sin(a)*R.r});}});
function newState(){
 return {day:1,hour:8,acc:0,res:{coal:200,wood:150,steel:40,raw:30,food:100},pop:{w:30,e:10,c:10},sick:{w:0,e:0,c:0},
  hope:60,disc:10,furnace:{lvl:1,over:false,stress:0,out:false},laws:[],lawCd:0,tech:[],research:null,rp:0,
  emergencyLeft:0,emergencyCd:0,festivalCd:0,strike:0,hungryFrac:0,starve:0,nextEvent:40,seen:{},
  b:slots.map(()=>null),log:[],cache:{temps:slots.map(()=>-20),occ:slots.map(()=>0),homeless:0,groups:[0,0,0,0],treated:0,untreated:0,out:-20},
  stats:{deaths:0,arrived:0,maxPop:50,minTemp:-20,built:0},ended:false,started:true};
}
const has=id=>S.laws.includes(id)||S.tech.includes(id);
const totalPop=()=>S.pop.w+S.pop.e+S.pop.c;
const totalSick=()=>S.sick.w+S.sick.e+S.sick.c;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=n=>Math.floor(Math.random()*n);
const pround=x=>{const f=Math.floor(x);return f+(Math.random()<x-f?1:0)};
const staffN=b=>b.staff.w+b.staff.e+b.staff.c;
const staffEff=b=>(b.staff.w+b.staff.e+b.staff.c*0.6)/B[b.type].max;
function employed(t){let n=0;for(const b of S.b)if(b&&b.staff)n+=b.staff[t];return n}
function idle(t){return S.pop[t]-S.sick[t]-employed(t)}
function housingCap(){let c=0;for(const b of S.b)if(b&&B[b.type].kind==='house')c+=B[b.type].cap;return c}
/* ====================== 温度 ====================== */
function outsideTemp(day,hour){if(S&&S.mode==='camp')return campTemp(day,hour);
 let t=-18-day*0.9;
 for(const [a,b,d] of [[7,9,-22],[15,17,-30],[22,24,-38]]) if(day>=a&&day<=b) t+=d;
 if(day>=28) t+=-52-(day-28)*12;
 if(hour<6||hour>=21) t-=5;
 return Math.round(t);
}
function furnaceHeat(){const f=S.furnace;if(f.lvl===0||f.out)return 0;return [0,15,30,45][f.lvl]+(has('power1')?10:0)+(has('power2')?10:0)+(f.over?15:0)}
function coalUse(){const f=S.furnace;let c=[0,4,8,12][f.lvl]*(f.over?1.5:1);for(const b of S.b)if(b&&b.type==='heater')c+=2;return c}
function heaterBonus(i){if(S.furnace.out)return 0;let h=0;const s=slots[i];S.b.forEach((b,j)=>{if(b&&b.type==='heater'&&j!==i){const d=Math.hypot(slots[j].x-s.x,slots[j].y-s.y);if(d<0.33)h+=20}});return Math.min(h,30)}
function slotTemp(i,out){const b=S.b[i];return Math.round(out+furnaceHeat()*RINGS[slots[i].ring].f+heaterBonus(i)+(b?B[b.type].ins:0))}
const level=t=>t>=0?0:t>=-20?1:t>=-40?2:3;
/* ====================== 人口操作 ====================== */
function pickType(pool){const tot=pool.w+pool.e+pool.c;if(tot<=0)return null;let r=Math.random()*tot;for(const t of ['w','e','c']){if(r<pool[t])return t;r-=pool[t]}return 'w'}
function reconcile(){
 for(const t of ['w','e','c']){
  let over=employed(t)-(S.pop[t]-S.sick[t]);
  for(let i=S.b.length-1;i>=0&&over>0;i--){const b=S.b[i];if(b&&b.staff&&b.staff[t]>0){const k=Math.min(b.staff[t],over);b.staff[t]-=k;over-=k}}

 else if(need>0){S.res.coal=0;if(!f.out)log('煤炭耗尽，熔炉熄灭了！','bad');f.out=true}

 // 工作

 if(S.emergencyLeft>0&&Math.random()<0.04)kill(1,false,'在紧急轮班中出了工伤事故');

 houses.sort((a,b)=>b.t-a.t);
 let remain=totalPop();const groups=[0,0,0,0],occ=slots.map(()=>0);
 for(const h of houses){const n=Math.min(remain,h.cap);occ[h.i]=n;remain-=n;groups[level(h.t)]+=n}
 const homeless=remain;
 // 生病
 const rates=[0.001,0.005,0.012,0.025];
 for(let l=0;l<4;l++)newSickX+=groups[l]*rates[l];
 newSickX+=homeless*(rates[level(out)]+0.008);
 if(has('sawdust'))newSickX+=totalPop()*0.0005;
 const ns=makeSick(pround(newSickX));
 // 医疗
 let cap=0;S.b.forEach(b=>{if(b&&b.type==='med')cap+=10*staffEff(b)});if(has('med2'))cap*=1.5;cap=Math.floor(cap);

 heal(pround(treated*0.06*(has('care')?1.5:1)*(has('med2')?1.2:1))+pround(untreated*0.012*(level(out)<2?1.5:1)));
 const sd=S.mode==='camp'&&CH[S.ch].safe?0:pround(untreated*0.008);if(sd)kill(sd,true,'因病去世');
 // 冻死
 if(out<-45){const fx=groups[3]*0.002+homeless*0.004;const fd=pround(fx);if(fd)kill(fd,false,'被活活冻死')}

 const hf=homeless/P,cf=(groups[1]*0.3+groups[2]+groups[3]*1.5+(level(out)>=2?homeless*0.5:0))/P,uf=untreated/P,gf=S.hungryFrac,comf=groups[0]/P;
 let dH=-0.05+0.05*comf-0.5*hf-0.7*gf-0.4*uf-0.3*cf+(has('shelter')?0.02:0);
 let dD=0.01-0.05*comf+0.5*hf+0.6*gf+0.25*uf+0.3*cf+(overtimeNow?0.25:0)+(S.emergencyLeft>0?0.35:0)+(has('childlabor')?0.01:0);
 if(f.out&&out<-25){dH-=0.2;dD+=0.15}
 S.hope=clamp(S.hope+dH,0,100);S.disc=clamp(S.disc+dD,0,100);
 // 熔炉压力

 // 计时器
 for(const k of ['lawCd','emergencyLeft','emergencyCd','festivalCd','strike'])if(S[k]>0)S[k]--;
 S.cache={temps,occ,homeless,groups,treated,untreated,out,working};
 lastDelta={};for(const k in S.res){S.res[k]=Math.max(0,S.res[k]);lastDelta[k]=S.res[k]-before[k]}
 S.stats.maxPop=Math.max(S.stats.maxPop,totalPop());
 S.hope=clamp(S.hope,0,100);S.disc=clamp(S.disc,0,100);
 // 结束判定

 if(f.stress>=100)return endGame('explode');
 if(totalPop()<=0)return endGame('dead');
 if(S.hope<=0)return endGame('hope');
 if(S.disc>=100)return endGame('disc');

 if(S.hour>=24){S.hour=0;S.day++;if(S.day>maxDays())return S.mode==='camp'?campTimeUp():endGame('win');log(`—— 第${S.day}天 ——`);save()}

 const mid=(ra+rb)/2;const pr=PATHR.slice(1).reduce((p,c)=>Math.abs(c-mid)<Math.abs(p-mid)?c:p);
 const pts=[a];if(ra>0.25)pts.push(polar(pr,aa));let d=ab-aa;while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;
 const r=ra>0.25&&rb>0.25?pr:Math.max(ra,rb)>0.25?pr:0.2;
 const n=Math.ceil(Math.abs(d)/0.18);for(let k=1;k<n;k++)pts.push(polar(r,aa+d*k/n));
 if(rb>0.25)pts.push(polar(pr,ab));pts.push(b);return pts;
}

function chState(i){

 Object.assign(s,{mode:'camp',ch:i,objDone:[],newSeen:{},extended:false,hope:st.hope,disc:st.disc});
 s.res={...s.res,...st.res};s.pop={...st.pop};s.sick={w:0,e:0,c:0,...(st.sick||{})};s.furnace.lvl=st.lvl;s.tech=[...(st.tech||[])];
 s.nextEvent=24+14+rnd(10);if(i<2)s.nextEvent=48+rnd(12);
 s.stats.maxPop=s.pop.w+s.pop.e+s.pop.c;
 for(const k in st.b){const v=st.b[k],type=Array.isArray(v)?v[0]:v;s.b[+k]={type,staff:B[type].kind==='work'?{w:0,e:0,c:0}:null};if(Array.isArray(v))s.b[+k].staff[v[2]||'w']=v[1]}

 const nb=CH[i].newB.length||CH[i].feat.laws&&!CH[i-1].feat.laws||CH[i].feat.tech&&!CH[i-1].feat.tech;

/* ====================== 主循环 ====================== */
let prevT=performance.now(),uiT=0;
const hourLen=()=>HOUR_MS*((S.hour<6||S.hour>=22)?0.6:1); // 夜里没人干活，时间稍快
function windNow(){if(!S)return 0.3;return S.day>=28?3:S.cache.out<-40?0.9:0.3}
function loop(now){
 const dt=Math.min(100,now-prevT);prevT=now;
 try{
  if(S&&!S.ended&&!S.demo){
   if(speed>0&&!modalOpen){S.acc+=dt*speed;let guard=0;while(S.acc>=hourLen()&&!S.ended&&!modalOpen&&guard++<5){S.acc-=hourLen();processHour();if(!S.ended){recordHour();refreshSheet(false);if(place&&place.slot>=0)renderPlace()}}}
   uiT+=dt;if(uiT>200){uiT=0;updateUI()}
   if(tut)renderTut();
  }
  if(S){updateCamera(dt);updateWalkers(dt);updateParts(dt,windNow());draw(now,dt)}
 }catch(err){console.error(err)}
 requestAnimationFrame(loop);
}
/* ====================== 开始 / 结束 ====================== */
function makeDemo(){
 const d=newState();d.demo=true;d.ended=true;d.day=5;d.hour=20;d.furnace.lvl=2;S=d;
 const put=(i,t)=>{d.b[i]={type:t,staff:B[t].kind==='work'?{w:B[t].max,e:0,c:0}:null}};
 [0,1,2,3,4,5].forEach(i=>put(i,i%2?'house':'tent'));
 put(6,'coal');put(8,'heater');put(9,'kitchen');put(11,'med');put(13,'lab');put(16,'saw');put(19,'hunt');put(22,'steel');put(25,'coal');put(14,'house');put(28,'hunt');
 d.pop={w:80,e:10,c:10};recalcCache();d.cache.working=true;return d;
}

 <div class="mhead"><b>故事模式</b><span>十章故事，一章一章解锁新建筑。第一次玩建议从第1章开始，也可以直接选任意一章。</span></div>
 ${chapterListHTML()}
 <div class="mhead"><b>生存模式（自由模式）</b><span>全部建筑一次开放，坚持 ${DAYS} 天熬过大风暴，适合熟悉玩法后挑战。</span></div>
 <div class="btns">${saved?`<button class="btn" id="contBtn">继续生存（第${saved.day}天）</button>`:''}<button class="btn" id="newBtn">${saved?'新的生存挑战':'开始生存模式'}</button></div></div>`;
 sc.scrollTop=0;
 sc.querySelectorAll('.chnode').forEach(b=>b.onclick=()=>showChapterIntro(+b.dataset.ch));
 $('#newBtn').onclick=()=>startGame(true);
 if(saved)$('#contBtn').onclick=()=>{S=saved;S.ended=false;resetTransient();begin()};
}

function startGame(){S=newState();resetTransient();begin();log('人们围着熔炉瑟瑟发抖……先给大家搭起帐篷吧。');startTutorial(false)}
function begin(){$('#screen').classList.add('hidden');$('#modal').classList.add('hidden');modalOpen=false;closeSheet();recalcCache();S.cache.working=S.hour>=8&&S.hour<18;setSpeed(1);updateUI()}
function endGame(why){
 if(S&&S.mode==='camp')return campOver(why);

 const T={win:['黎明','大风暴终于停歇。冰原上的风变得温柔，熔炉依旧在燃烧。你的人民活下来了——很多年后，人们仍会在火边讲述这段日子。'],
  explode:['熔炉爆炸','一声巨响撕裂了夜空。超载的熔炉炸成了一团火球，城市的心脏停止了跳动。'],
  dead:['寂静之城','最后一个人倒在雪中。熔炉旁再无人添煤，冰原重归寂静。'],
  hope:['希望熄灭','人们不再相信这座城市还有未来。他们把你赶出城门，独自走进了暴风雪。'],
  disc:['城市叛乱','愤怒的人群冲进了指挥所。你被铐上镣铐，扔到了城外的冰原上。']}[why];
 const sc=$('#screen');sc.classList.remove('hidden');T[1]=L(T[1]);
 sc.innerHTML=`<div class="scr"><h1 style="${why==='win'?'':'color:#ffb9a8;text-shadow:0 0 30px rgba(255,50,30,.7)'}">${T[0]}</h1><div class="sub">${why==='win'?'你赢了':'游戏结束'} · 第${Math.min(S.day,DAYS)}天</div>

 $('#againBtn').onclick=()=>startGame(true);$('#menuBtn').onclick=()=>showIntro();
}
